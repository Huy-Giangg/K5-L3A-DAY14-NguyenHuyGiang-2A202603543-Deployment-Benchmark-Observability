services:
  - type: web
    name: production-ai-agent
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: DAILY_BUDGET_USD
        value: "5.0"
      - key: MONTHLY_BUDGET_USD
        value: "100.0"
      - key: LOG_LEVEL
        value: INFO
